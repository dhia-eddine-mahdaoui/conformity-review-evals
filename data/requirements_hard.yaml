# Requirements for the harder fictional file (BX-90 drive). Same check kinds as requirements.yaml.
requirements:
  - id: HRD-1.1
    text: The declaration of conformity states the manufacturer name and address.
    kind: evidence_present
    docs: [declaration]
    patterns: ['^Manufacturer:\s*\S+', '^Address:\s*\S+']

  - id: HRD-1.2
    text: The model designation is identical in the declaration, the data sheet and the test report.
    kind: consistency
    sources:
      - {doc: declaration, label: '^model\b', capture: 'BX-\d+[A-Z]?'}
      - {doc: datasheet, label: '^model\b', capture: 'BX-\d+[A-Z]?'}
      - {doc: test_report, label: '^model\b', capture: 'BX-\d+[A-Z]?'}

  - id: HRD-2.1
    text: Rated voltage in the declaration matches the test report (units may differ).
    kind: consistency
    sources:
      - {doc: declaration, label: 'rated voltage', family: volt}
      - {doc: test_report, label: 'rated input voltage', family: volt}

  - id: HRD-2.2
    text: Rated power in the declaration matches the test report (units may differ).
    kind: consistency
    sources:
      - {doc: declaration, label: 'rated power', family: watt}
      - {doc: test_report, label: 'rated power', family: watt, kinds: [table, text]}

  - id: HRD-2.3
    text: Rated power in the declaration matches the data sheet.
    kind: consistency
    sources:
      - {doc: declaration, label: 'rated power', family: watt}
      - {doc: datasheet, label: 'rated power', family: watt}

  - id: HRD-2.4
    text: Rated input current on the nameplate (scanned annex) matches the rating table of the test report.
    kind: consistency
    sources:
      - {doc: test_report, label: 'rated input current', family: ampere, kinds: [table, text]}
      - {doc: test_report, label: 'rated current', family: ampere, kinds: [ocr]}

  - id: HRD-2.5
    text: The test report applies the same edition of EXS 2200-1 as the declaration cites.
    kind: consistency
    sources:
      - {doc: declaration, label: 'EXS 2200-1', capture: 'EXS 2200-1:\d{4}'}
      - {doc: test_report, label: 'EXS 2200-1', capture: 'EXS 2200-1:\d{4}'}

  - id: HRD-2.6
    text: Rated frequency in the declaration matches the test report.
    kind: consistency
    sources:
      - {doc: declaration, label: 'rated frequency', family: hertz}
      - {doc: test_report, label: 'rated frequency', family: hertz}

  - id: HRD-3.1
    text: Insulation resistance is at least 50 MOhm at every test point.
    kind: limit
    doc: test_report
    row: '^insulation resistance'
    op: '>='
    limit: 50 MOhm

  - id: HRD-3.2
    text: Dielectric strength was applied at 2000 V AC or more at every test point.
    kind: limit
    doc: test_report
    row: '^dielectric strength'
    op: '>='
    limit: 2000 V

  - id: HRD-3.3
    text: Touch current does not exceed 0.5 mA in any condition.
    kind: limit
    doc: test_report
    row: '^touch current'
    op: '<='
    limit: 0.5 mA

  - id: HRD-3.4
    text: Earth leakage current does not exceed 3.5 mA.
    kind: limit
    doc: test_report
    row: '^earth leakage'
    op: '<='
    limit: 3.5 mA

  - id: HRD-3.5
    text: Temperature rise does not exceed 40 K at any measuring point.
    kind: limit
    doc: test_report
    row: '^temperature rise'
    op: '<='
    limit: 40 K

  - id: HRD-3.6
    text: Sound pressure level does not exceed 70 dB(A).
    kind: limit
    doc: test_report
    row: '^sound pressure level'
    op: '<='
    limit: 70 dB

  - id: HRD-3.7
    text: The test report states the degree of protection IP54 as verified by test.
    kind: evidence_present
    docs: [test_report]
    patterns: ['degree of protection IP54 was verified']

  - id: HRD-3.8
    text: Efficiency is at least 94 % at every operating point.
    kind: limit
    doc: test_report
    row: '^efficiency at'
    op: '>='
    limit: 94 %

  - id: HRD-3.9
    text: Fault current in the scanned annex does not exceed 10 A.
    kind: limit
    doc: test_report
    row: '^fault current'
    kinds: [ocr]
    op: '<='
    limit: 10 A

  - id: HRD-3.10
    text: Dielectric strength was tested for 60 s with no breakdown.
    kind: evidence_present
    docs: [test_report]
    patterns: ['dielectric strength[^\n]*\b2\.5\b[^\n]*kV AC[^\n]*60 s[^\n]*no breakdown']

  - id: HRD-4.1
    text: The declaration cites the general safety standard EXS 2200-1.
    kind: evidence_present
    docs: [declaration]
    patterns: ['EXS 2200-1:\d{4}']

  - id: HRD-4.2
    text: The declaration is signed on behalf of the manufacturer and carries a date of issue.
    kind: evidence_present
    docs: [declaration]
    patterns: ['^Signed for and on behalf of:\s*\S+', '^Date of issue:\s*\d{4}-\d{2}-\d{2}']

  - id: HRD-4.3
    text: The test report states the accreditation number of the test laboratory.
    kind: evidence_present
    docs: [test_report]
    patterns: ['accredit\w*[^\n]{0,40}(no\.?|number|certificate)[:\s]+[A-Z0-9-]{4,}']

  - id: HRD-4.4
    text: The test report records a passed vibration test.
    kind: evidence_present
    docs: [test_report]
    patterns: ['vibration test[^\n]*(pass|no damage)']

  - id: HRD-5.1
    text: Every hazard with High residual risk has a completed verification record.
    kind: risk_table
    doc: risk_assessment

  - id: HRD-5.2
    text: The risk assessment covers electric shock and shows an acceptable, verified residual risk.
    kind: semantic
    docs: [risk_assessment]
    retrieve: ['electric shock']
    heuristic:
      accept: '\|\s*(Low|Medium)\s*\|\s*V-\d+\s*$'
      reject: '\|\s*High\s*\|\s*(Pending|-|None)\s*$'

  - id: HRD-5.3
    text: The risk assessment covers overheating and shows an acceptable, verified residual risk.
    kind: semantic
    docs: [risk_assessment]
    retrieve: ['overheating']
    heuristic:
      accept: '\|\s*(Low|Medium)\s*\|\s*V-\d+\s*$'
      reject: '\|\s*High\s*\|\s*(Pending|-|None)\s*$'

  - id: HRD-2.7
    text: The supply frequency used during the tests matches the rated frequency in the declaration.
    kind: consistency
    sources:
      - {doc: declaration, label: 'rated frequency', family: hertz}
      - {doc: test_report, label: 'supply frequency', family: hertz}

  - id: HRD-3.12
    text: Protective conductor current does not exceed 0.5 mA.
    kind: limit
    doc: test_report
    row: '^protective conductor current'
    op: '<='
    limit: 0.5 mA

  - id: HRD-3.13
    text: Ground continuity resistance in the scanned annex does not exceed 0.1 Ohm.
    kind: limit
    doc: test_report
    row: '^ground continuity'
    kinds: [ocr]
    op: '<='
    limit: 0.1 Ohm
